<!DOCTYPE html>
<html lang="sl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Registracija</title>
    <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div class="app">
      <header class="top">
        <a class="back" href="index.html">‹</a>
        Registracija
        <span class="logo">PayPal</span>
        <span class="help">?</span>
      </header>
      <main>
        <h2 style="font-weight:400;font-size:20px">Pridruži se igri!</h2>
        <p class="sub" style="padding:0">Ustvari svoj račun. Tvoja naslednja igra se začne takoj.</p>
        <div class="row">
          <div>
            <label>Ime</label>
            <input type="text" placeholder="Tvoje ime">
          </div>
          <div>
            <label>Priimek</label>
            <input type="text" placeholder="Tvoj priimek">
          </div>
        </div>
        <div>
          <label>E-pošta</label>
          <input type="email" placeholder="tvoj.email@primer.si">
        </div>
        <div>
          <label>Geslo</label>
          <input type="password" placeholder="Najmanj 8 znakov">
        </div>
        <div>
          <label>Datum rojstva</label>
          <input type="text" placeholder="DD. MM. LLLL">
        </div>
        <label class="chk">
          <input type="checkbox">
          Potrjujem, da sem star/-a vsaj 18 let in se strinjam s pogoji uporabe ter politiko zasebnosti.
        </label>
        <a class="btn" href="blackjack.html">Registriraj se</a>
        <p class="note">Že imaš račun? <u>Prijavi se</u></p>
      </main>
    </div>
  </body>
</html>
